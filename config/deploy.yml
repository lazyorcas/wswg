# https://community.hetzner.com/tutorials/deploy-rails-8-app-on-hetzner-with-kamal
# Specs:
# - 4 vCPUs
# - 8GB of RAM
# - 80GB of storage
# - ARM64 architecture

<% require "dotenv"; Dotenv.load(".env"); Dotenv.load(".env.production") %>

# Name of your application. Used to uniquely configure containers.
service: wswg

# Name of the container image.
image: <%= ENV["KAMAL_REGISTRY_USERNAME"] %>/wswg

# Deploy to these servers.
servers:
  web:
    - <%= ENV["SERVER_IP"] %>
  job:
    hosts:
      - <%= ENV["SERVER_IP"] %>
    cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# Remove this section when using multiple web servers and ensure you terminate SSL at your load balancer.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: <%= ENV["HOST_NAME"] %>
  forward_headers: true

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  # server: registry.digitalocean.com / ghcr.io / ...
  username: <%= ENV["KAMAL_REGISTRY_USERNAME"] %>

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - GMAIL_APP_PASSWORD
    - S3_SECRET_ACCESS_KEY
    - JINA_API_KEY
    - GOOGLE_OAUTH2_CLIENT_SECRET
    - GOOGLE_API_KEY
    - MAPBOX_ACCESS_TOKEN
    - IPINFO_ACCESS_TOKEN
    - OPENAI_ACCESS_TOKEN
    - TICKETMASTER_API_KEY
    - PROXY_PASSWORD
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - OPENSEARCH_HOST
    - BLAZER_DATABASE_URL
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    # SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    JOB_CONCURRENCY: 4

    # Set number of cores available to the application on each server (default: 1).
    WEB_CONCURRENCY: 1

    # Match this to any external database server to configure Active Record correctly
    # Use wswg-db for a db accessory server on same machine via local kamal docker network.
    DB_HOST: wswg-db

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

    # From .env
    HOST_NAME: <%= ENV["HOST_NAME"] %>
    ROOT_USER_EMAIL: <%= ENV["ROOT_USER_EMAIL"] %>
    ROOT_USER_CITY_NAME: <%= ENV["ROOT_USER_CITY_NAME"] %>
    GMAIL_SENDER_NAME: <%= ENV["GMAIL_SENDER_NAME"] %>
    GMAIL_SENDER_EMAIL: <%= ENV["GMAIL_SENDER_EMAIL"] %>
    GMAIL_NO_REPLY_SENDER_EMAIL: <%= ENV["GMAIL_NO_REPLY_SENDER_EMAIL"] %>
    GMAIL_USERNAME: <%= ENV["GMAIL_USERNAME"] %>
    CHROMIUM_URL: ws://wswg-chromium:3000
    GOOGLE_OAUTH2_CLIENT_ID: <%= ENV["GOOGLE_OAUTH2_CLIENT_ID"] %>
    MAPBOX_PUBLIC_ACCESS_TOKEN: <%= ENV["MAPBOX_PUBLIC_ACCESS_TOKEN"] %>
    SENTRY_DSN: <%= ENV["SENTRY_DSN"] %>
    HOTJAR_ID: <%= ENV["HOTJAR_ID"] %>
    PROXY_HOST: <%= ENV["PROXY_HOST"] %>
    PROXY_PORT: <%= ENV["PROXY_PORT"] %>
    PROXY_USERNAME: <%= ENV["PROXY_USERNAME"] %>
    STRIPE_PAYMENT_LINK: <%= ENV["STRIPE_PAYMENT_LINK"] %>
    STRIPE_PUBLISHABLE_KEY: <%= ENV["STRIPE_PUBLISHABLE_KEY"] %>
    GOOGLE_TAG_MANAGER_ID: <%= ENV["GOOGLE_TAG_MANAGER_ID"] %>

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "wswg_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: arm64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.3.5
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  db:
    image: postgres:15
    roles: 
      - web
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
    files:
      - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
      # - db/latest.dump:/latest.dump
    directories:
      - data:/var/lib/postgresql/data
  db-backup:
    image: eeshugerman/postgres-backup-s3:15
    roles: 
      - web
    env:
      clear:
        SCHEDULE: '@daily'
        BACKUP_KEEP_DAYS: 7
        S3_BUCKET: wswg-pg-backups
        S3_PREFIX: backups
        S3_ACCESS_KEY_ID: <%= ENV["S3_ACCESS_KEY_ID"] %>
        POSTGRES_HOST: wswg-db
        POSTGRES_DATABASE: wswg_production
        POSTGRES_USER: postgres
      secret:
        - S3_SECRET_ACCESS_KEY
        - POSTGRES_PASSWORD
  pgweb:
    image: sosedoff/pgweb
    roles: 
      - web
    port: "127.0.0.1:8081:8081"
    env:
      secret:
        - PGWEB_DATABASE_URL
  chromium:
    image: ghcr.io/browserless/chromium:latest
    roles: 
      - web
    port: "127.0.0.1:9222:3000"
    env:
      clear:
        TIMEOUT: 600000 # 10 minutes
  opensearch:
    image: opensearchproject/opensearch:3.0.0
    roles:
      - web
    env:
      clear:
        discovery.type: single-node
        OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      secret:
        - OPENSEARCH_INITIAL_ADMIN_PASSWORD
    volumes:
      - wswg_opensearch_data:/usr/share/opensearch/data