default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ user ]
      threads: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i - 2 %>
      processes: 1
      polling_interval: 0.1
    - queues: [ scraper ]
      threads: 2
      processes: 1
      polling_interval: 60
    - queues: [ default ]
      threads: <%= ENV.fetch("RAILS_MAX_THREADS", 5).to_i - 2 %>
      processes: 2
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
