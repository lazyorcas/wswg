eventbrite:
  name: Eventbrite
  template_url: https://www.eventbrite.com/d/%{city_slug}/all-events/
  scraper_type: BrowserScraper

luma:
  name: Luma
  template_url: https://lu.ma/%{city_slug}
  scraper_type: BrowserScraper

meetup:
  name: Meetup
  template_url: https://www.meetup.com/find/?location=%{city_slug}&eventType=inPerson&source=EVENTS&sortField=DATETIME
